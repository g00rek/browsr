id = "g00rek.browsr"
name = "Browsr"
version = "0.6.0"
min_herdr_version = "0.8.2"
description = "Keep a dedicated Chromium tab group aligned with each Herdr workspace"
platforms = ["linux"]

[[actions]]
id = "setup"
title = "Set up dedicated Chromium"
description = "Install the native bridge and prepare the dedicated Chromium profile"
contexts = ["workspace"]
command = ["./bridge.py", "setup"]

[[actions]]
id = "launch"
title = "Show or launch Browsr"
description = "Show the existing Browsr window or launch its dedicated Chromium profile"
contexts = ["workspace"]
command = ["./bridge.py", "launch"]

[[actions]]
id = "panel"
title = "Browsr panel"
description = "Open the Browsr panel, or close it if it is already open"
contexts = ["workspace"]
command = ["./bridge.py", "panel"]

[[actions]]
id = "open-link"
title = "Open localhost in workspace browser group"
description = "Route the clicked localhost URL to this workspace's Chromium group"
contexts = ["workspace"]
command = ["./bridge.py", "open-link"]

[[link_handlers]]
id = "workspace-localhost"
title = "Open in this workspace's Chromium group"
pattern = "(?i)^https?://(localhost|127\\.0\\.0\\.1|\\[::1\\])(:[0-9]+)?([/?#].*)?$"
action = "open-link"
platforms = ["linux"]

[[events]]
on = "workspace.created"
command = ["./bridge.py", "hook"]

[[events]]
on = "workspace.renamed"
command = ["./bridge.py", "hook"]

[[events]]
on = "workspace.closed"
command = ["./bridge.py", "hook"]

[[events]]
on = "workspace.focused"
command = ["./bridge.py", "hook"]

# An ordinary pane, not a popup. A popup is session-modal: it takes every
# keystroke, Escape included, so it has to be dismissed before anything else can
# be typed. A status panel is something to glance at while working, so it should
# behave like every other pane and answer to the same keys.
[[panes]]
id = "panel"
title = "Browsr"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/panel.py\""]
